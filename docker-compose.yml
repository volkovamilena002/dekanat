# Продакшен: приложение + PostgreSQL + Caddy (автоматический HTTPS).
# Настройки — в файле .env рядом (образец: deploy/.env.example). Инструкция: docs/deploy.md

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dekanat
      POSTGRES_USER: dekanat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dekanat -d dekanat"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dekanat:${POSTGRES_PASSWORD}@db:5432/dekanat
      SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-1}
    depends_on:
      db:
        condition: service_healthy

  # Разовые задачи: docker compose run --rm tools npm run db:setup
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://dekanat:${POSTGRES_PASSWORD}@db:5432/dekanat
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Задайте SITE_ADDRESS в файле .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
